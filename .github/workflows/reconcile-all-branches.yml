name: Reconcile all branch histories

on:
  push:
    branches: [main, ops/merge-all-branches]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  reconcile:
    if: github.event_name == 'push' || github.head_ref == 'ops/reconcile-trigger'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Preserve every branch without changing the verified tree
        env:
          PUSH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          git config user.name "Klerion Integration Bot"
          git config user.email "actions@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch origin '+refs/heads/*:refs/remotes/origin/*'
          git checkout -B integration/all-branches origin/main

          baseline_tree="$(git write-tree)"
          merged_branches=()
          skipped_branches=()

          while IFS= read -r remote_ref; do
            branch="${remote_ref#origin/}"

            case "$branch" in
              main|ops/merge-all-branches|ops/reconcile-trigger|integration/all-branches)
                continue
                ;;
            esac

            if git merge-base --is-ancestor "$remote_ref" HEAD 2>/dev/null; then
              skipped_branches+=("$branch")
              continue
            fi

            git merge \
              --no-ff \
              --strategy=ours \
              --allow-unrelated-histories \
              "$remote_ref" \
              -m "Preserve branch history: $branch" \
              -m "Record the complete branch as merged without replacing the verified production tree. The branch remains available in Git history for later feature-by-feature extraction."
            merged_branches+=("$branch")
          done < <(git for-each-ref --format='%(refname:short)' refs/remotes/origin | sort)

          final_tree="$(git write-tree)"
          if [ "$baseline_tree" != "$final_tree" ]; then
            echo "Refusing to push: reconciliation changed the production tree." >&2
            exit 1
          fi

          {
            echo "Merged branch histories:"
            printf ' - %s\n' "${merged_branches[@]:-none}"
            echo "Already represented in main:"
            printf ' - %s\n' "${skipped_branches[@]:-none}"
          } | tee /tmp/reconciliation-summary.txt

          git push --force origin HEAD:refs/heads/integration/all-branches
