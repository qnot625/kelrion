name: Export feature port sources

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  export:
    if: github.head_ref == 'ops/export-trigger'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Export source branches
        run: |
          set -euo pipefail
          mkdir -p /tmp/klerion-export
          for ref in main Developer-1 Developer-3 Developer-5 Queue-management; do
            safe="$(echo "$ref" | tr '/ ' '__')"
            git archive --format=tar.gz --output="/tmp/klerion-export/${safe}.tar.gz" "origin/${ref}"
          done
          git log --all --decorate --oneline --graph -n 250 > /tmp/klerion-export/history.txt
      - uses: actions/upload-artifact@v4
        with:
          name: klerion-feature-port-sources
          path: /tmp/klerion-export
          if-no-files-found: error
