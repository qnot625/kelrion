name: Port 3 Executor

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/port3-executor.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Port 3 branch
        uses: actions/checkout@v4
        with:
          ref: port/developer-3-workforce-core
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply staged client and lock patch
        id: patch
        continue-on-error: true
        run: |
          set -euo pipefail
          if [ -f .port-fix/patch.diff ]; then
            git apply --check --binary .port-fix/patch.diff
            git apply --binary .port-fix/patch.diff
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Backend install
        id: backend_install
        continue-on-error: true
        run: npm ci

      - name: Backend typecheck
        id: backend_typecheck
        continue-on-error: true
        run: npm run typecheck

      - name: Backend lint
        id: backend_lint
        continue-on-error: true
        run: npm run lint

      - name: Backend tests
        id: backend_tests
        continue-on-error: true
        run: npm test

      - name: Backend build
        id: backend_build
        continue-on-error: true
        run: npm run build

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Company Console install
        id: web_install
        continue-on-error: true
        working-directory: apps/web
        run: pnpm install --no-frozen-lockfile

      - name: Company Console typecheck
        id: web_typecheck
        continue-on-error: true
        working-directory: apps/web
        run: pnpm typecheck

      - name: Company Console static check
        id: web_lint
        continue-on-error: true
        working-directory: apps/web
        run: pnpm lint

      - name: Company Console build
        id: web_build
        continue-on-error: true
        working-directory: apps/web
        run: pnpm build

      - name: Record validation result on feature branch
        if: always()
        env:
          PATCH: ${{ steps.patch.outcome }}
          BACKEND_INSTALL: ${{ steps.backend_install.outcome }}
          BACKEND_TYPECHECK: ${{ steps.backend_typecheck.outcome }}
          BACKEND_LINT: ${{ steps.backend_lint.outcome }}
          BACKEND_TESTS: ${{ steps.backend_tests.outcome }}
          BACKEND_BUILD: ${{ steps.backend_build.outcome }}
          WEB_INSTALL: ${{ steps.web_install.outcome }}
          WEB_TYPECHECK: ${{ steps.web_typecheck.outcome }}
          WEB_LINT: ${{ steps.web_lint.outcome }}
          WEB_BUILD: ${{ steps.web_build.outcome }}
        run: |
          set -euo pipefail
          validated=true
          for outcome in "$PATCH" "$BACKEND_INSTALL" "$BACKEND_TYPECHECK" "$BACKEND_LINT" "$BACKEND_TESTS" "$BACKEND_BUILD" "$WEB_INSTALL" "$WEB_TYPECHECK" "$WEB_LINT" "$WEB_BUILD"; do
            if [ "$outcome" != "success" ]; then validated=false; fi
          done

          git reset --hard HEAD
          if [ "$validated" = "true" ] && [ -f .port-fix/patch.diff ]; then
            git apply --check --binary .port-fix/patch.diff
            git apply --binary .port-fix/patch.diff
            rm -rf .port-fix
          fi

          mkdir -p .port-validation
          cat > .port-validation/result.md <<EOF
          # Port 3 validation

          source_head=$GITHUB_SHA
          validated=$validated
          patch=$PATCH
          backend_install=$BACKEND_INSTALL
          backend_typecheck=$BACKEND_TYPECHECK
          backend_lint=$BACKEND_LINT
          backend_tests=$BACKEND_TESTS
          backend_build=$BACKEND_BUILD
          company_console_install=$WEB_INSTALL
          company_console_typecheck=$WEB_TYPECHECK
          company_console_static_check=$WEB_LINT
          company_console_build=$WEB_BUILD
          EOF

          git config user.name "Klerion Integration Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Record Developer 3 validation result"
          git push origin HEAD:port/developer-3-workforce-core

          if [ "$validated" != "true" ]; then exit 1; fi
