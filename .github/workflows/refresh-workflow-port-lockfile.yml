name: Refresh workflow port lockfile

on:
  push:
    branches:
      - port/workflow-engine
    paths:
      - package-lock.json
      - apps/api/package.json
      - packages/persistence/package.json
      - modules/platform/workflow/package.json
      - .github/workflows/refresh-workflow-port-lockfile.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: port/workflow-engine
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install --package-lock-only --ignore-scripts
      - name: Commit regenerated lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Refresh workflow workspace lockfile"
          git push origin HEAD:port/workflow-engine
