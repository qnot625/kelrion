name: Apply reviewed feature port patch

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: startsWith(github.head_ref, 'port/') && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect staged patch
        id: state
        run: |
          if [ -f .port-fix/patch.diff ] || [ -f .port-patch/chunks.sha256 ]; then
            echo "apply=true" >> "$GITHUB_OUTPUT"
          else
            echo "apply=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply reviewed patch
        if: steps.state.outputs.apply == 'true'
        run: |
          set -euo pipefail
          if [ -f .port-fix/patch.diff ]; then
            cp .port-fix/patch.diff /tmp/feature-port.patch
          else
            sha256sum --check --strict .port-patch/chunks.sha256
            cat .port-patch/chunk_* > /tmp/feature-port.patch.gz.b64
            test "$(wc -c < /tmp/feature-port.patch.gz.b64)" -eq "$(cat .port-patch/base64-length.txt)"
            base64 --decode /tmp/feature-port.patch.gz.b64 > /tmp/feature-port.patch.gz
            echo "$(cat .port-patch/archive.sha256)  /tmp/feature-port.patch.gz" | sha256sum --check --strict
            gzip --test /tmp/feature-port.patch.gz
            gzip --decompress --stdout /tmp/feature-port.patch.gz > /tmp/feature-port.patch
          fi
          test -s /tmp/feature-port.patch
          git apply --check --binary /tmp/feature-port.patch
          git apply --index --binary /tmp/feature-port.patch
          rm -rf .port-fix .port-patch
          git add -A

      - name: Commit applied feature port
        if: steps.state.outputs.apply == 'true'
        run: |
          set -euo pipefail
          git config user.name "Klerion Integration Bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Apply reviewed feature port"
          git push origin HEAD:${{ github.head_ref }}
